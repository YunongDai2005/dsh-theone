const token='__TOKEN__';
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';

const node=(tag,text,parent,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e;};

function render(){if(!state)return;$('plan').disabled=busy||!state.capabilities.model;$('draft-count').textContent=state.proposals.length;$('current-project').textContent=state.routing.currentId?name(state.routing.currentId):'Projects';$('about').textContent=(state.preview?'Offline demo':'Sandbox')+' · The One 0.4.6';const host=$('messages'),pos=host.scrollTop;host.replaceChildren();if(!state.messages.length){const e=node('div',undefined,host,'empty');cell(e);node('h1','Create an invoice',e);node('p','Tell One the project, amount and service.',e);}for(const m of state.messages){const a=node('article',undefined,host,'message '+m.role);if(m.role==='assistant'){const label=node('div',undefined,a,'assistant-label');cell(label);node('span','One',label);}node('div',m.text,a,'message-text');if(m.role==='assistant'&&m.route?.corrected){const r=node('div',undefined,a,'route-note');icon('check',r);node('span','Project correction remembered',r);}}

async function refresh(){state=await api('/state');render();}
async function action(fn){if(busy)return;busy=true;render();$('sheet').querySelectorAll('button,select').forEach(e=>e.disabled=true);try{await fn();await refresh();}catch(e){toast(e.message);try{await refresh();}catch{}}finally{busy=false;render();if(activeProposal&&!$('overlay').hidden)openReview(activeProposal);}}
function startSheet(title){if($('overlay').hidden)returnFocus=document.activeElement;$('app-screen').inert=true;$('overlay').hidden=false;const sheet=$('sheet');sheet.replaceChildren();node('div',undefined,sheet,'handle');const h=node('div',undefined,sheet,'sheet-header');node('h2',title,h).id='sheet-title';const close=button(undefined,h,'close',closeSheet);close.setAttribute('aria-label','Close');icon('close',close);sheet.focus();return sheet;}
function closeSheet(){if($('overlay').hidden)return;$('overlay').hidden=true;$('app-screen').inert=false;activeProposal=null;(returnFocus?.isConnected?returnFocus:$('drafts')).focus();}
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeSheet();};
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeSheet();}if(e.key==='Tab'){const all=[...$('sheet').querySelectorAll('button:not(:disabled),select:not(:disabled),a[href]')],first=all[0],last=all.at(-1);if(!first){e.preventDefault();return;}if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('sheet'))){e.preventDefault();first.focus();}}});
function detail(parent,label,value){const r=node('div',undefined,parent,'detail-row');node('span',label,r);return node('div',value,r,'detail-value');}
function openReview(id){const p=state.proposals.find(p=>p.id===id);if(!p)return;activeProposal=id;const sheet=startSheet(p.state==='CREATED'?'Draft created':'Review invoice');node('span',statusLabel(p),sheet,'tag');money(p,sheet);node('div',p.payload.items[0].name,sheet,'invoice-description');const box=node('div',undefined,sheet,'detail-box');const project=detail(box,'Project',name(p.topic_id));if(p.state==='REVIEW')button('Change',project,'change',()=>openCorrection(p.id));detail(box,'Recipient',p.payload.primary_recipients[0].billing_info.email_address);detail(box,'Quantity','1');detail(box,'Total',p.payload.items[0].unit_amount.value+' '+p.payload.items[0].unit_amount.currency_code);if(p.remote_id)node('div',p.remote_id,sheet,'remote-id');if(p.failure){node('p',p.failure,sheet,'sheet-note');node('div','Invoice number: '+p.payload.detail.invoice_number,sheet,'remote-id');}if(p.state==='REVIEW'){button(state.preview?'Create demo draft':'Create Sandbox draft',sheet,'primary',()=>action(async()=>{await api('/approve',{id:p.id,digest:p.digest});toast(state.preview?'Demo draft created. Nothing was sent.':'Sandbox draft created and verified.');})).disabled=busy||!state.capabilities.paypal;node('p',state.preview?'Simulated only. No PayPal API call or invoice delivery.':'Creates an unsent draft. Nothing is sent to the recipient.',sheet,'sheet-note');}else if(['UNCERTAIN','VERIFYING'].includes(p.state)&&p.remote_id){button('Verify existing draft',sheet,'primary',()=>action(async()=>{await api('/reconcile',{id:p.id});toast('Existing draft verified.');})).disabled=busy||!state.capabilities.paypal;}else button('Done',sheet,'primary',closeSheet);}
function openCorrection(id){const p=state.proposals.find(p=>p.id===id);activeProposal=id;const sheet=startSheet('Change project');node('p','The recipient will update with the project. Review it again before creating the draft.',sheet,'sheet-copy');const label=node('label','Project',sheet,'field-label');label.htmlFor='correct-project';const select=node('select',undefined,sheet);select.id='correct-project';for(const t of state.topics.filter(t=>t.invoice_enabled)){const o=node('option',t.title,select);o.value=t.id;o.selected=t.id===p.topic_id;}button('Save and review',sheet,'primary',()=>action(async()=>{await api('/correct',{id:p.id,revision:p.revision,topic_id:select.value});toast('Project and recipient updated. Correction remembered.');}));button('Back to invoice',sheet,'secondary',()=>openReview(id));}
function openDrafts(){activeProposal=null;const sheet=startSheet('Invoice drafts');const list=node('div',undefined,sheet,'invoice-list');if(!state.proposals.length)node('p','No drafts yet.',list,'sheet-copy');state.proposals.toReversed().forEach(p=>invoiceCard(p,list));button('New invoice',sheet,'primary',()=>{closeSheet();composeInvoice();});}
function openProjects(){activeProposal=null;const sheet=startSheet('Projects');for(const t of state.topics){const b=button(undefined,sheet,'project-row'+(t.id===state.routing.currentId?' active':''),()=>{closeSheet();sendMessage(`Continue with ${t.title}.`);});const text=node('div',undefined,b);node('strong',t.title,text);node('small',t.invoice_enabled?'Invoices':'Notes only',text);icon(t.id===state.routing.currentId?'check':'arrow',b);}node('p','Choose a project to continue its conversation.',sheet,'sheet-note');}
$('drafts').onclick=openDrafts;$('projects').onclick=openProjects;$('switch-project').onclick=openProjects;
$('about').onclick=()=>{activeProposal=null;const s=startSheet('About this demo');node('p','A PayPal invoice concept using The One 0.4.6 routing semantics and visual identity. This is an independent prototype, not an official PayPal app.',s,'sheet-copy');node('p',state.preview?'Model responses and PayPal operations are simulated locally. No external service is called.':'Sandbox drafts only. Configuration does not verify service availability.',s,'sheet-copy');const d=node('div',undefined,s,'detail-box');detail(d,'Version','The One 0.4.6');detail(d,'Corrections',String(state.routing.correctionCount));detail(d,'Model',state.preview?'Simulated':state.capabilities.model?'Configured':'Not configured');detail(d,'PayPal',state.preview?'Simulated':state.capabilities.paypal?'Configured':'Not configured');button('Refresh records',s,'secondary',()=>{closeSheet();action(async()=>{toast('Records refreshed.');});});};
function resizeComposer(){$('message').style.height='31px';$('message').style.height=Math.min(100,$('message').scrollHeight)+'px';}
function composeInvoice(){$('message').value='Draft a 480 EUR invoice for the design client for website assets.';resizeComposer();$('message').focus();}
$('new-invoice').onclick=composeInvoice;$('message').addEventListener('input',resizeComposer);
function sendMessage(message){if(!message.trim()||busy)return;return action(async()=>{await api('/plan',{message});$('message').value='';resizeComposer();}).then(()=>$('messages').scrollTop=$('messages').scrollHeight);}
$('plan').onclick=()=>sendMessage($('message').value.trim());$('message').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!e.isComposing){e.preventDefault();$('plan').click();}};
refresh().then(()=>$('messages').scrollTop=$('messages').scrollHeight).catch(e=>toast(e.message));
</script></body></html>
