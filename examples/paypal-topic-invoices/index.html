/* The One Invoice Desk — demo interface in the manner of a PayPal web workspace.
   Independent prototype: no PayPal logo or wordmark. System fonts only; no external assets (strict CSP). */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --h0:#0070e0;--h1:#0b8573;--h2:#c9552e;--h3:#6a4fd6;--h4:#b8447f;--h5:#1f7f9c;
  /* The invoice sheet stays a white document in both themes. */
  --sheet:#fff;--sheet-ink:#001435;--sheet-2:#2c3a55;--sheet-muted:#687385;--sheet-line:#e3e8ef;--sheet-soft:#f5f7fa;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#070d1c;--card:#0f182b;--soft:#162238;--line:#1f2c47;--line-2:#324468;
  --ink:#eef3fb;--ink-2:#c3cee2;--muted:#8794ae;
  --navy:#cfe1ff;--tint:#10294d;--link:#5aa9ff;
  --ok:#3fc592;--ok-tint:#0d2c26;--warn:#f58a73;--warn-tint:#33191a;
  --shadow:0 1px 2px #0006,0 16px 36px -18px #000c;
  --h0:#5aa9ff;--h1:#4cc9b4;--h2:#f0907a;--h3:#a594f9;--h4:#ea8fb8;--h5:#7cc6da;
  color-scheme:dark;
}
[data-hue="0"]{--hue:var(--h0);--hue-doc:#0070e0}[data-hue="1"]{--hue:var(--h1);--hue-doc:#0b8573}

*{box-sizing:border-box}

/* ---------- Top bar ---------- */
.top{height:68px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:28px;padding:0 28px}

/* ---------- Layout ---------- */

.primary{width:100%;min-height:50px;border-radius:99px;background:#0070e0;color:#fff;font-size:16px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s,transform .1s}

.panel{flex:none;padding:18px 20px}

<script nonce="__TOKEN__">
const token='__TOKEN__';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const ARCHIVED=['DISCARDED','ARCHIVED_UNCERTAIN'],CURRENCIES=['EUR','USD','GBP'];
let state=null,histories=new Map(),reviews=new Map(),metrics=null;

let retryPlan=null,sideReturnFocus=null;
const seen=new Map(),known=new Set(),flash=new Set(),celebrate=new Set();

// ---------- DOM helpers ----------
function h(tag,cls,text,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;if(parent)parent.append(e);return e;}
function icon(name,parent){const s=document.createElementNS(NS,'svg');s.setAttribute('class','ic');s.setAttribute('aria-hidden','true');const u=document.createElementNS(NS,'use');u.setAttribute('href','#i-'+name);s.append(u);if(parent)parent.append(s);return s;}

// Cell shape and wordmark are ported from TheOne v0.4.6 src/client.ts (MIT).
const waves=[.4,.13,.31,.17,.29,.18,-.11,.25],fx=n=>n.toFixed(3);
function curve(pts){const n=pts.length;let d=`M${fx(pts[0][0])} ${fx(pts[0][1])}`;pts.forEach((p1,i)=>{const p0=pts[(i+n-1)%n],p2=pts[(i+1)%n],p3=pts[(i+2)%n];d+=`C${fx(p1[0]+(p2[0]-p0[0])/6)} ${fx(p1[1]+(p2[1]-p0[1])/6)} ${fx(p2[0]-(p3[0]-p1[0])/6)} ${fx(p2[1]-(p3[1]-p1[1])/6)} ${fx(p2[0])} ${fx(p2[1])}`;});return d+'Z';}
function frame(t){const {sin,cos,PI}=Math,p=waves;return{d:curve(Array.from({length:44},(_,i)=>{const a=i/44*2*PI,r=7.4+.12*sin(p[7]*t)+.22*sin(2*a+p[5]*t)+.07*sin(3*a+p[6]*t);return[10+r*cos(a),10+r*sin(a)];})),x:10+.6*sin(p[1]*t)+.25*sin(p[2]*t),y:10+.55*sin(p[3]*t)+.2*sin(p[4]*t),r:2.9+.12*sin(p[0]*t)};}
function paint(e,f){e.firstChild.setAttribute('d',f.d);const c=e.lastChild;c.setAttribute('cx',f.x);c.setAttribute('cy',f.y);c.setAttribute('r',f.r);}
function cell(parent,live){const e=document.createElementNS(NS,'svg');e.setAttribute('viewBox','0 0 20 20');e.setAttribute('class','cell');e.setAttribute('aria-hidden','true');if(live)e.dataset.live='1';const path=document.createElementNS(NS,'path');path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','1.5');const c=document.createElementNS(NS,'circle');c.setAttribute('fill','currentColor');e.append(path,c);paint(e,frame(0));parent.append(e);return e;}
function avatar(parent,live){const a=h('span','avatar',null,parent);cell(a,live);return a;}
document.querySelectorAll('[data-cell]').forEach(e=>cell(e,true));
const calm=matchMedia('(prefers-reduced-motion: reduce)');let last=0;
(function tick(t=0){if(!calm.matches&&!document.hidden&&t-last>50){const f=frame(t/1000*(busy?3.2:.8));document.querySelectorAll('.cell[data-live]').forEach(e=>paint(e,f));last=t;}requestAnimationFrame(tick);})();

// ---------- Data helpers ----------
async function api(path,data){
  const res=await fetch(path,{method:data?'POST':'GET',headers:{'X-TheOne-Token':token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});
  let body={};try{body=await res.json();}catch{}
  if(!res.ok){const e=Error(body.error||'The local server did not answer. Reload the page.');e.status=res.status;throw e;}
  return body;
}
const topicOf=id=>state?.topics.find(t=>t.id===id)||null;
const titleOf=id=>topicOf(id)?.title||'Unassigned';
const hueOf=id=>{const i=state?state.topics.findIndex(t=>t.id===id):-1;return i<0?'x':String(i%6);};
const unit=p=>p.payload.items[0].unit_amount;
const fmt=v=>{const [w,f='']=String(v).split('.');return w.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+f.padEnd(2,'0');};
const clock=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
const isActive=p=>!ARCHIVED.includes(p.state);
function stateInfo(p){
  switch(p.state){
    case 'REVIEW':return{label:'Needs review',cls:''};
    case 'CREATING':return{label:'Creating',cls:''};
    case 'VERIFYING':return{label:'Verifying',cls:''};
    case 'CREATED':return{label:state.preview?'Simulated draft':'Verified draft',cls:'ok'};
    case 'UNCERTAIN':return{label:'Needs verification',cls:'warn'};
    case 'DISCARDED':return{label:'Discarded',cls:'off'};
    case 'ARCHIVED_UNCERTAIN':return{label:'Archived, unverified',cls:'off'};
    default:return{label:p.state,cls:''};
  }
}
const FIELD={project:'Project',recipient:'Bill to',amount:'Amount',currency:'Currency',description:'Service'};
const fieldValue=(k,v)=>k==='project'?titleOf(v):k==='amount'?fmt(v):v;
function diff(a,b){return Object.keys(FIELD).filter(k=>a[k]!==b[k]).map(k=>({k,before:fieldValue(k,a[k]),after:fieldValue(k,b[k])}));}
function toast(text,kind){clearTimeout(toastTimer);const t=$('toast');t.className='toast'+(kind==='err'?' err':'');t.textContent=text;toastTimer=setTimeout(()=>t.textContent='',kind==='err'?8000:5000);}

// ---------- Loading ----------
async function refresh(){
  const next=await api('/state');
  const recent=next.proposals.slice(-24);
  const [hs,rs,m]=await Promise.all([
    Promise.all(recent.map(p=>api(`/proposals/${p.id}/history`).then(v=>[p.id,v]).catch(()=>null))),
    Promise.all(recent.map(p=>api(`/proposals/${p.id}/review`).then(v=>[p.id,v]).catch(()=>null))),
    api('/routing/metrics').catch(()=>null)]);
  histories=new Map(hs.filter(Boolean));reviews=new Map(rs.filter(Boolean));metrics=m;
  for(const p of next.proposals){
    const key=p.revision+':'+p.state,old=seen.get(p.id);
    if(old&&old!==key){flash.add(p.id);if(p.state==='CREATED')celebrate.add(p.id);}
    seen.set(p.id,key);
  }
  clearTimeout(flashTimer);flashTimer=setTimeout(()=>{flash.clear();celebrate.clear();},2600);
  state=next;
  if(lens!=='all'&&!topicOf(lens))lens='all';
  if(!state.proposals.some(p=>p.id===selectedId)){
    const live=state.proposals.filter(isActive);
    selectedId=(live.filter(p=>p.topic_id===state.routing.currentId).at(-1)||live.at(-1)||state.proposals.at(-1))?.id||null;
  }
  render();
}
async function act(fn,done){
  if(busy)return;busy=true;render();
  try{const r=await fn();mode=null;await refresh();if(done)toast(typeof done==='function'?done(r):done);}
  catch(e){toast(e.message,'err');try{await refresh();}catch{}}
  finally{busy=false;render();}
}
async function send(raw){
  const text=(raw||'').trim();
  if(!text||busy||!state?.capabilities.model)return;
  pendingText=text;$('message').value='';resize();busy=true;render();scrollEnd();
  try{
    // A request ID makes a repeated submit replay the first result instead of drafting twice.
    if(!retryPlan||retryPlan.message!==text)retryPlan={message:text,request_id:crypto.randomUUID()};
    const r=await api('/plan',retryPlan);
    retryPlan=null;
    if(r.proposal){selectedId=r.proposal.id;mode=null;}
    const tid=r.route?.topicId??null;
    if(lens!=='all'&&tid!==lens)lens=tid||'all';
    pendingText=null;await refresh();
  }catch(e){
    pendingText=null;$('message').value=text;resize();toast(e.message,'err');try{await refresh();}catch{}
  }finally{busy=false;pendingText=null;render();scrollEnd();$('message').focus();}
}
function select(id){selectedId=id;mode=null;render();openSide();}
function setLens(id){lens=id;closeSide();render();scrollEnd();}

// ---------- Top bar ----------
function renderTop(){
  const sim=state.preview,chip=$('env-chip');chip.className='env-chip'+(sim?' sim':'');
  chip.textContent=sim?'Offline preview · simulated':'PayPal Sandbox · drafts only';
  const tabs=$('tabs');tabs.replaceChildren();
  btn('tab'+(lens==='all'?' on':''),'All activity',tabs,()=>setLens('all'));
  for(const t of state.topics){
    const b=btn('tab'+(lens===t.id?' on':''),null,tabs,()=>setLens(t.id));b.dataset.hue=hueOf(t.id);
    h('i','dot'+(t.invoice_enabled?'':' hollow'),null,b);h('span',null,t.title,b);
    const review=state.proposals.filter(p=>p.topic_id===t.id&&p.state==='REVIEW').length;
    if(review){const n=h('span','badge',String(review),b);n.title=`${review} draft${review>1?'s':''} to review`;}
    if(t.id===state.routing.currentId){const l=h('i','live',null,b);l.title='The router is working in this project';}
  }
}

// ---------- Conversation ----------
function turns(){
  const out=[];let cur=null;
  for(const m of state.messages){
    if(m.role==='assistant'&&cur&&!cur.reply)cur.reply=m;
    else{cur={user:m.role==='user'?m:null,reply:m.role==='user'?null:m};out.push(cur);}
  }
  for(const t of out){const m=t.user||t.reply;t.topicId=m.topic_id??null;t.route=m.route;t.key=m.id;}
  return out;
}
function cardsByMessage(){
  const map=new Map(),add=(k,c)=>{if(!map.has(k))map.set(k,[]);map.get(k).push(c);};
  for(const p of state.proposals){
    const hist=histories.get(p.id);
    if(hist)hist.versions.forEach((v,i)=>{const src=v.source_message_ids?.[0];if(src)add(src,{p,v,prev:hist.versions[i-1]||null});});
    else{const m=state.messages.find(m=>m.role==='user'&&m.created_at===p.created_at);
      if(m)add(m.id,{p,prev:null,v:{revision:1,cause:'proposed',fields:{project:p.topic_id,amount:unit(p).value,currency:unit(p).currency_code,description:p.payload.items[0].name}}});}
  }
  return map;
}
const REASONS={'short-continuation':'A short follow-up continues the current work.','temporary-return':'Returns to the work that was interrupted.'};
function receipt(t,parent){
  const r=t.route,box=h('div','receipt',null,parent),line=h('div','receipt-line',null,box);
  if(r.action==='CLARIFY'){const pill=h('div','pill ask',null,line);icon('alert',pill);h('span',null,'Paused: which project is this for?',pill);}
  else{
    const pill=h('div','pill',null,line);
    const verb=r.corrected?'Corrected to':{KEEP:'Stays in',SWAP:'Switched to',MOUNT:'Opened',CREATE:'New notes topic'}[r.transition]||'Routed to';
    h('span',null,verb,pill);h('i','dot'+(topicOf(t.topicId)?.invoice_enabled===false?' hollow':''),null,pill);h('b',null,titleOf(t.topicId),pill);
  }
  const bits=[];
  if(r.corrected&&r.correctedFrom)bits.push(`You moved this from ${titleOf(r.correctedFrom)}; the router remembers.`);
  else if(r.customerGuard)bits.push('Server rule: an invoice needs a named client.');
  else if(r.reason)bits.push(REASONS[r.reason]||r.reason);
  if(r.relatedIds?.length)bits.push('Reads '+r.relatedIds.map(titleOf).join(', ')+' as reference only.');
  const why=h('div','why',bits.join(' '),box);
  let cost='';
  if(r.trace){const n=r.trace.calls?.length??0;cost=n?`${n} routing call${n>1?'s':''}${r.trace.tier==='recheck'?', rechecked':''}${Number.isFinite(r.elapsedMs)?` · ${(r.elapsedMs/1000).toFixed(1)} s`:''}`:'no routing call needed';}
  else if(/^scripted/.test(r.model||''))cost='scripted preview';
  if(cost){if(bits.length)why.append(' ');h('em',null,'['+cost+']',why);}
}
function brief(text,parent){
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean),rows=lines.filter(l=>/^[^:]{3,40}: \d/.test(l));
  if(rows.length<2){h('div','text',text,parent);return;}
  const box=h('div','brief',null,parent),rest=lines.filter(l=>!rows.includes(l));
  h('h3',null,rest.shift()||'Invoice status',box);
  for(const l of rows){const i=l.indexOf(': '),row=h('div','brief-row',null,box);h('span',null,l.slice(0,i),row);h('b',null,l.slice(i+2).replace(/\.$/,''),row);}
  h('small',null,(rest.length?rest.join(' ')+' ':'')+'Read from local records, not written by a model.',box);
}
function ticket({p,v,prev},parent){
  const current=v.revision===p.revision;
  const b=btn('ticket'+(p.id===selectedId&&current?' sel':'')+(current?'':' old'),null,parent,()=>select(p.id));b.dataset.hue=hueOf(p.topic_id);
  const amt=h('div','t-amt',fmt(v.fields.amount),b);h('small',null,v.fields.currency,amt);
  const mid=h('div',null,null,b);
  if(!prev){h('div','t-title',v.fields.description,mid);h('div','t-meta','Draft prepared · '+titleOf(v.fields.project),mid);}
  else{h('div','t-title','Draft revised · revision '+v.revision,mid);
    for(const c of diff(prev.fields,v.fields)){const row=h('div','t-diff',FIELD[c.k]+' ',mid);h('del',null,c.before,row);row.append(' → ');h('ins',null,c.after,row);}}
  const side=h('div','t-side',current?(p.state==='REVIEW'?'Review':'Open'):'Superseded',b);if(current)icon('chev',side);
  b.setAttribute('aria-label',`Open invoice ${fmt(v.fields.amount)} ${v.fields.currency}, revision ${v.revision}`);
}
function renderThread(){
  const host=$('thread-inner'),scroller=$('thread'),stick=scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<140;
  host.replaceChildren();
  const all=turns(),shown=lens==='all'?all:all.filter(t=>t.topicId===lens),cards=cardsByMessage();
  if(!shown.length&&!pendingText){
    const e=h('div','empty',null,host);avatar(e,true);
    h('h2',null,lens==='all'?'Describe an invoice':'Nothing here yet',e);
    h('p',null,lens==='all'?'Name the client, the amount and the service. One routes each message to its project and prepares a draft for you to review.':`Messages routed to ${titleOf(lens)} appear here.`,e);
  }
  shown.forEach((t,i)=>{
    const sec=h('section','turn'+(known.has(t.key)?'':' new'),null,host);sec.dataset.hue=hueOf(t.topicId);known.add(t.key);
    if(t.user)h('div','bubble',t.user.text,sec);
    if(t.route)receipt(t,sec);
    if(t.reply){
      const r=h('div','reply',null,sec);avatar(r);const body=h('div','reply-body',null,r);
      brief(t.reply.text,body);
      for(const c of cards.get(t.user?.id)||[])ticket(c,body);
      if(i===shown.length-1&&t===all.at(-1)&&t.route?.action==='CLARIFY'&&t.route.candidateIds?.length&&!busy){
        const q=h('div','quick',null,body);
        for(const id of t.route.candidateIds){const c=btn('chip',null,q,()=>send(titleOf(id)+'.'));c.dataset.hue=hueOf(id);h('i','dot',null,c);h('span',null,titleOf(id),c);}
      }
    }
  });
  if(pendingText){
    const sec=h('section','turn new',null,host);sec.dataset.hue='x';h('div','bubble pending',pendingText,sec);
    const th=h('div','thinking',null,sec);avatar(th,true);h('span',null,'Routing to a project, then planning',th);h('b',null,null,h('i',null,null,th));
  }
  if(stick)scrollEnd();
  const t=lens==='all'?null:topicOf(lens),title=$('lens-title');title.replaceChildren();
  if(t){title.dataset.hue=hueOf(t.id);h('i','dot'+(t.invoice_enabled?'':' hollow'),null,title);title.append(t.title);}
  else{delete title.dataset.hue;title.textContent='Conversation';}
  $('lens-sub').textContent=t?t.summary:`${state.preview?'Offline preview.':'One conversation.'} ${state.topics.length} projects kept separate.`;
}
function scrollEnd(){const s=$('thread');requestAnimationFrame(()=>s.scrollTop=s.scrollHeight);}
function renderSuggest(){
  const host=$('suggest');host.replaceChildren();
  const clients=state.topics.filter(t=>t.invoice_enabled),cur=topicOf(state.routing.currentId),client=cur?.invoice_enabled?cur:clients[0];
  const items=[];
  if(client)items.push(['New invoice',`Draft a 480 EUR invoice for the ${client.title} for website assets.`]);
  const editable=state.proposals.find(p=>p.id===selectedId&&p.state==='REVIEW');
  if(editable)items.push(['Revise the amount',`Change invoice ${editable.payload.detail.invoice_number} for the ${titleOf(editable.topic_id)} to 520 EUR.`]);
  if(client)items.push(['Invoice status',`What is the invoice status for the ${client.title}?`]);
  if(state.topics.some(t=>!t.invoice_enabled))items.push(['Log an expense','Record 72 EUR of moving expenses in my household budget. Do not create an invoice.']);
  if(clients.length>1)items.push(['Unnamed client','Draft a 300 EUR invoice for that client for project services.']);
  for(const [label,text] of items)btn('chip',label,host,()=>{$('message').value=text;resize();$('message').focus();});
}

// ---------- Invoice ----------
function steps(p,parent){
  const names=['Review','Approved','PayPal ID','Read back'],s=p.state,lost=s==='UNCERTAIN'||s==='ARCHIVED_UNCERTAIN';
  const reached=s==='CREATED'?4:s==='VERIFYING'?2:s==='CREATING'?1:lost?(p.remote_id?3:2):0;
  const box=h('div','steps'+(celebrate.has(p.id)?' go':'')+(busy&&s==='REVIEW'?' busy':''),null,parent);
  names.forEach((name,i)=>{
    const alert=lost&&i===reached;
    const st=h('div','step'+(alert?' alert':i<reached?' done':i===reached&&isActive(p)?' now':''),null,box);
    const n=h('span','node',null,st);if(!alert)icon('check',n);h('span',null,name,st);
  });
}
const EVENTS={proposed:['Drafted from the conversation',''],legacy_snapshot:['Imported from an earlier record',''],conversation_revision:['Revised in the conversation',''],manual_revision:['Edited by hand',''],project_corrected:['Moved to another project',''],creation_requested:['You approved this exact revision',''],remote_identified:['PayPal returned an invoice ID','ok'],remote_verified:['Read back and matched','ok'],verification_pending:['Outcome unknown','warn'],reconciliation_requested:['Looking the draft up in PayPal',''],remote_recovered:['Found by invoice number','ok'],reconciliation_unresolved:['Still unresolved','warn'],local_discarded:['Discarded locally',''],uncertain_archived:['Archived without verification','warn']};
function renderSide(){
  const host=$('side-body');host.replaceChildren();
  const list=state.proposals.toReversed();
  if(list.length>1){
    const strip=h('div','drafts',null,host);
    for(const p of [...list.filter(isActive),...list.filter(p=>!isActive(p))]){
      const d=btn('draft'+(p.id===selectedId?' on':'')+(isActive(p)?'':' off'),null,strip,()=>select(p.id));d.dataset.hue=hueOf(p.topic_id);
      h('i','dot',null,d);h('span',null,`${fmt(unit(p).value)} ${unit(p).currency_code}`,d);h('small',null,stateInfo(p).label,d);
    }
  }
  const p=state.proposals.find(x=>x.id===selectedId);
  if(!p){
    const e=h('div','card insp-empty',null,host);icon('receipt',h('span','avatar',null,e));h('b',null,'No draft yet',e);
    e.append('Ask for an invoice in the conversation. It lands here for review, and nothing reaches PayPal until you create it.');
  }else invoice(p,host);
  routingPanel(host);
}
function invoice(p,host){
  const hist=histories.get(p.id),rev=reviews.get(p.id),u=unit(p),info=stateInfo(p),sim=state.preview;
  const sheet=h('article','sheet'+(flash.has(p.id)?' flash':''),null,host);sheet.dataset.hue=hueOf(p.topic_id);
  const pad=h('div','sheet-pad',null,sheet),top=h('div','sheet-top',null,pad),left=h('div',null,null,top);
  h('div','sheet-title','Invoice draft',left);h('div','inv-no',p.payload.detail.invoice_number,left);
  h('span','state '+info.cls,info.label,top);
  h('div','eyebrow due',p.state==='CREATED'?'Draft total':'Amount due',pad);
  const amt=h('div','amount',fmt(u.value),pad);h('small',null,u.currency_code,amt);
  if(p.state==='CREATED'){const b=h('div','banner'+(celebrate.has(p.id)?' go':''),null,pad);icon('check',b);b.append(sim?'Simulated draft created. Nothing was sent.':'Verified in PayPal Sandbox as an unsent draft.');}
  const meta=h('div','meta',null,pad);
  const bill=h('div',null,null,meta);h('div','eyebrow','Bill to',bill);h('div','meta-v addr',p.payload.primary_recipients[0].billing_info.email_address,bill);
  const proj=h('div',null,null,meta),pe=h('div','eyebrow row',null,proj);h('span',null,'Project',pe);
  if(p.state==='REVIEW'&&state.topics.filter(t=>t.invoice_enabled).length>1)btn('link','Change',pe,()=>{mode=mode==='project'?null:'project';render();});
  const pv=h('div','meta-v',null,proj);h('i','dot',null,pv);pv.append(titleOf(p.topic_id));
  const items=h('div','items',null,pad);
  const line=(cls,a,b,c)=>{const r=h('div','item '+cls,null,items);h('span',null,a,r);h('span',null,b,r);h('span',null,c,r);};
  line('head','Description','Qty','Amount');
  line('',p.payload.items[0].name,'1',`${fmt(u.value)} ${u.currency_code}`);
  line('total','Total','',`${fmt(u.value)} ${u.currency_code}`);
  h('div','revline',`Revision ${p.revision} · ${p.state==='REVIEW'?'Ready for your review':'Saved in invoice history'}`,pad);
  const vs=hist?.versions||[],changes=vs.length>1?diff(vs.at(-2).fields,vs.at(-1).fields):[];
  if(changes.length&&p.state==='REVIEW'){
    const box=h('div','diffbox',null,pad);h('div','eyebrow',`Changed since revision ${vs.at(-2).revision}`,box);
    for(const c of changes){const r=h('div','diffrow',null,box);h('span',null,FIELD[c.k],r);h('del',null,c.before,r);r.append('→');h('ins',null,c.after,r);}
  }
  const stub=h('div','stub',null,sheet);
  steps(p,stub);
  const canDiscard=rev?.can_discard===true;
  if(mode==='edit'&&p.state==='REVIEW')editForm(p,stub);
  else if(mode==='project'&&p.state==='REVIEW')projectForm(p,stub);
  else if(mode==='discard'&&canDiscard)discardForm(p,stub);
  else if(p.state==='REVIEW'){
    const go=btn('primary',busy?'Working…':sim?'Create demo draft':'Create Sandbox draft',stub,()=>act(()=>api('/approve',{id:p.id,digest:p.digest}),sim?'Simulated draft created. No PayPal call was made.':'Draft created in PayPal Sandbox and read back. Nothing was sent.'));
    go.disabled=busy||!state.capabilities.paypal;
    const a=h('div','actions',null,stub);
    const e=btn('ghost',null,a,()=>{mode='edit';render();});icon('edit',e);e.append('Edit');e.disabled=busy;
    if(canDiscard){const d=btn('ghost',null,a,()=>{mode='discard';render();});icon('trash',d);d.append('Discard');d.disabled=busy;}
    h('p','note',!state.capabilities.paypal?'PayPal Sandbox is not configured, so creation is unavailable.':sim?'Simulated only. No PayPal API call, no delivery.':'Creates one unsent draft and reads it back. Nothing is sent to the recipient.',stub);
  }else if(['CREATING','VERIFYING','UNCERTAIN'].includes(p.state)){
    if(p.failure)h('p','note warn',p.failure,stub);
    const go=btn('primary',busy?'Checking…':'Check with PayPal',stub,()=>act(()=>api('/reconcile',{id:p.id}),'Existing draft found and verified. Nothing was created twice.'));
    go.disabled=busy||!state.capabilities.paypal;
    if(canDiscard){const a=h('div','actions',null,stub);const d=btn('ghost',null,a,()=>{mode='discard';render();});icon('trash',d);d.append('Archive this attempt');d.disabled=busy;}
    h('p','note','The outcome of the create request is unknown. One never retries a create; it looks the draft up by invoice number.',stub);
  }else if(p.state==='CREATED'){
    const r=h('div','remote',null,stub);h('span','eyebrow',sim?'Simulated PayPal invoice ID':'PayPal Sandbox invoice ID',r);r.append(p.remote_id||'');
    h('p','note','Status DRAFT. Recipient, line and total match the reviewed version. Not sent, not payable.',stub);
  }else h('p','note','This draft is closed. It stays in the history for the record.',stub);
  if(hist?.events?.length){
    const sec=h('section','card panel',null,host);h('h3',null,'Activity',sec);
    for(const ev of hist.events){
      const [title,kind]=EVENTS[ev.kind]||[String(ev.kind).replaceAll('_',' '),''];
      const row=h('div','event '+kind,null,sec);h('time',null,clock(ev.created_at),row);const body=h('div',null,null,row);h('b',null,title,body);
      const d=ev.details||{},extra=[];
      for(const c of d.changes||[])extra.push(`${FIELD[c.field]||c.field}: ${fieldValue(c.field,c.before)} → ${fieldValue(c.field,c.after)}`);
      if(d.remote_id)extra.push(d.remote_id);if(d.reason)extra.push(d.reason);
      if(extra.length)h('p',null,extra.join(' · '),body);
    }
  }
}
function routingPanel(host){
  const sim=state.preview,sec=h('section','card panel',null,host);h('h3',null,'Routing',sec);
  if(metrics){
    const grid=h('div','stats',null,sec);
    const stat=(n,label)=>{const s=h('div','stat',null,grid);h('b',null,String(n??0),s);h('span',null,label,s);};
    stat(metrics.turns,'turns handled');stat(metrics.calls,'model calls');stat(state.messages.filter(m=>m.role==='user'&&m.route?.action==='CLARIFY').length,'clarifications');stat(state.routing.correctionCount,'corrections kept');
  }
  const caps=h('div','caps',null,sec);
  for(const [name,on] of [['Model API',state.capabilities.model],['PayPal API',state.capabilities.paypal]]){
    const c=h('span',null,name+' ',caps);h('b',sim?'sim':on?'':'off',sim?'simulated':on?'configured':'not configured',c);
  }
  h('p','fine',(metrics?.traced_turns?`Median routing time ${metrics.latency_ms?.p50??'–'} ms, ${metrics.rechecks} recheck${metrics.rechecks===1?'':'s'}. `:sim?'Scripted preview: no model calls are made. ':'')+`The One routing ${state.routing.version||''}. Independent prototype, not an official PayPal product.`,sec);
}
function formButtons(parent,label,run,danger){
  const go=btn('primary'+(danger?' danger':''),busy?'Working…':label,parent,run);go.disabled=busy;
  const a=h('div','actions',null,parent);btn('ghost','Cancel',a,()=>{mode=null;render();}).disabled=busy;
}
function editForm(p,parent){
  const f=h('div','form',null,parent),u=unit(p);
  const ld=h('label',null,'Service',f),desc=h('input',null,null,ld);desc.value=p.payload.items[0].name;desc.maxLength=200;
  const pair=h('div','pair',null,f);
  const la=h('label',null,'Amount',pair),amount=h('input',null,null,la);amount.value=u.value;amount.inputMode='decimal';
  const lc=h('label',null,'Currency',pair),cur=h('select',null,null,lc);
  cur.setAttribute('aria-label','Currency');
  for(const c of CURRENCIES){const o=h('option',null,c,cur);o.selected=c===u.currency_code;}
  formButtons(f,'Save as a new revision',()=>{
    const changes={},a=amount.value.trim().replace(',','.'),d=desc.value.trim();
    if(a!==u.value&&a+'.00'!==u.value)changes.amount=a;
    if(cur.value!==u.currency_code)changes.currency=cur.value;
    if(d!==p.payload.items[0].name)changes.description=d;
    if(!Object.keys(changes).length){mode=null;render();return;}
    act(()=>api('/revise',{id:p.id,revision:p.revision,changes}),'Saved as a new revision. Review it again before creating.');
  });
  amount.focus();amount.select();
}
function projectForm(p,parent){
  const f=h('div','form',null,parent);
  h('p',null,'Moving the draft changes its recipient to the one configured for that project, and the router remembers the correction.',f);
  const l=h('label',null,'Project',f),sel=h('select',null,null,l);
  sel.setAttribute('aria-label','Project');
  for(const t of state.topics.filter(t=>t.invoice_enabled)){const o=h('option',null,t.title,sel);o.value=t.id;o.selected=t.id===p.topic_id;}
  formButtons(f,'Move and review again',()=>{
    if(sel.value===p.topic_id){mode=null;render();return;}
    act(()=>api('/correct',{id:p.id,revision:p.revision,topic_id:sel.value}),'Project and recipient updated. The correction is remembered.');
  });
}
function discardForm(p,parent){
  const f=h('div','form',null,parent),unknown=p.state!=='REVIEW';
  h('p',null,unknown?'PayPal may still hold a draft from this attempt. Archiving only closes it here; it does not cancel anything in PayPal.':'Discard this local draft? Nothing exists in PayPal for it.',f);
  formButtons(f,unknown?'Archive anyway':'Discard draft',()=>act(()=>api('/discard',{id:p.id,revision:p.revision,...(unknown?{acknowledge_remote_unknown:true}:{})}).then(r=>{selectedId=null;return r;}),unknown?'Attempt archived. PayPal was not changed.':'Draft discarded.'),true);
}

// ---------- Shell ----------
function render(){
  if(!state)return;
  renderTop();renderThread();renderSuggest();renderSide();
  $('send').disabled=busy||!state.capabilities.model;
  $('message').placeholder=state.capabilities.model?(matchMedia('(max-width:560px)').matches?'Message One…':'Describe an invoice, a change, or ask for status…'):'Configure the model API to start';
  syncSide();
}
function resize(){const m=$('message');m.style.height='40px';if(m.value)m.style.height=Math.min(140,m.scrollHeight)+'px';}
const narrow=matchMedia('(max-width:920px)');
function syncSide(){
  const side=$('side'),open=narrow.matches&&side.classList.contains('open');
  if(!narrow.matches)side.classList.remove('open');
  $('scrim').hidden=!open;document.querySelector('.top').inert=open;document.querySelector('.chat').inert=open;
  side.inert=narrow.matches&&!open;
  if(open){side.setAttribute('role','dialog');side.setAttribute('aria-modal','true');}
  else{side.removeAttribute('role');side.removeAttribute('aria-modal');}
  $('open-side').setAttribute('aria-expanded',String(open));
}
function openSide(){if(!narrow.matches)return;sideReturnFocus=document.activeElement;$('side').classList.add('open');syncSide();$('close-side').focus();}
function closeSide(){const wasOpen=$('side').classList.contains('open');$('side').classList.remove('open');syncSide();if(wasOpen&&narrow.matches)(sideReturnFocus?.isConnected?sideReturnFocus:$('open-side')).focus();}
narrow.addEventListener('change',()=>{syncSide();if(state)render();});
const root=document.documentElement;
function setTheme(t,save){root.dataset.theme=t;const b=$('theme');b.replaceChildren();b.setAttribute('aria-label',`Switch to ${t==='light'?'dark':'light'} theme`);icon(t==='light'?'moon':'sun',b);if(save)try{localStorage.setItem('one-desk-theme',t);}catch{}}
let theme=null;try{theme=localStorage.getItem('one-desk-theme');}catch{}
setTheme(theme==='dark'?'dark':'light');
$('theme').onclick=()=>setTheme(root.dataset.theme==='light'?'dark':'light',true);
icon('send',$('send'));icon('receipt',$('open-side'));icon('close',$('close-side'));
$('open-side').onclick=openSide;$('close-side').onclick=closeSide;$('scrim').onclick=closeSide;
$('send').onclick=()=>send($('message').value);
$('message').addEventListener('input',resize);addEventListener('resize',resize);
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('message').value);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(mode){mode=null;render();$('side').focus();}else closeSide();return;}
  if(e.key==='Tab'&&narrow.matches&&$('side').classList.contains('open')){
    const focusable=[...$('side').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]')].filter(e=>e.getClientRects().length);
    const first=focusable[0],last=focusable.at(-1);
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('side'))){e.preventDefault();last?.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('side'))){e.preventDefault();first?.focus();}
  }
});
syncSide();
refresh().then(scrollEnd).catch(e=>toast(e.message,'err'));
</script></body></html>
