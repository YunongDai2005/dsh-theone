<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>话题细胞团</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e8e4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; color: #3b3a36; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; justify-content: center; padding: 16px 16px 8px; font-size: 12px; max-width: 900px; margin: 0 auto; }
  .demo b { font-weight: 500; color: #8a877f; margin-right: 4px; }
  .demo button { font: inherit; padding: 6px 10px; border-radius: 7px; border: 1px solid #d3d0c8; background: #f6f5f1; color: #45433e; cursor: pointer; }
  .demo button:hover { background: #fff; }
  .demo .sep { width: 100%; height: 0; }
  .hint { width: 100%; text-align: center; color: #8a877f; margin-top: 4px; line-height: 1.6; }
  #meter { width: 100%; text-align: center; color: #6f6c64; font-variant-numeric: tabular-nums; }
  .stage { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 6px 16px 40px; }
  .app { display: flex; width: 640px; max-width: 100%; height: 600px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px #0000000d, 0 8px 28px #00000012; background: var(--main); }
  .app.light { --sb:#f7f7f5; --main:#ffffff; --text:#2b2b2b; --muted:#8a8a86; --faint:#b5b4ae; --border:#e3e2dd; --hover:#0000000a;
    --ac:#a75b1e; --tint:#fff5ec; --line:#eed3bb; --heat:#ff7800; --glow:0 0 22px 4px #ff6b0024,0 4px 32px 6px #ff76000d; --hot:0 0 26px 8px #ff6b0040,0 4px 36px 10px #ff760018;
    --c-line:#c99267; --d-fill:#ffffff; --i-line:#d8d3ca; --i-dot:#cdb8a3; --q-line:#c4c1b8; --q-ink:#9a988f; --tip:#2e2d2a; --tip-ink:#f4f3ef; --menu:#ffffff; }
  .app.dark { --sb:#1f1f22; --main:#252528; --text:#e6e6e8; --muted:#8d8d93; --faint:#5e5e64; --border:#ffffff17; --hover:#ffffff0d;
    --ac:#93c8f3; --tint:#1d2a37; --line:#344d64; --heat:#80caff; --glow:0 0 22px 4px #80bae924; --hot:0 0 28px 8px #80bae94a;
    --c-line:#5d87ab; --d-fill:#2b2b30; --i-line:#3a3f46; --i-dot:#506477; --q-line:#4d555e; --q-ink:#7f8a94; --tip:#e9e9ec; --tip-ink:#1f1f22; --menu:#2c2c30; }
  .side { position: relative; flex: none; width: 260px; padding: 6px 12px; background: var(--sb); color: var(--text); font-size: 14px; user-select: none; display: flex; flex-direction: column; transition: width .5s cubic-bezier(.2,.7,.2,1); }
  .tx { white-space: nowrap; transition: opacity .2s ease; }
  .app.rail .side { width: 64px; }
  .app.rail .tx, .app.rail .sect, .app.rail .sess { opacity: 0; pointer-events: none; }
  .brand { height: 46px; display: flex; align-items: center; gap: 8px; padding-left: 8px; font-weight: 600; letter-spacing: .04em; }
  .brand i { flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--border); }
  .newsess { height: 38px; margin: 0 2px 12px; border: .5px solid var(--border); border-radius: 10px; display: flex; align-items: center; gap: 6px; padding-left: 12px; font-weight: 500; overflow: hidden; }
  nav { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .entry { position: relative; z-index: 2; isolation: isolate; display: flex; align-items: center; gap: 10px; min-height: 64px; margin: 4px 2px 0; padding: 12px 8px; cursor: pointer; overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--ac) 40%, var(--line)); border-radius: 12px; background: var(--tint); box-shadow: var(--glow); color: var(--ac); transition: box-shadow .3s ease; }
  .entry::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; opacity: 0; transition: opacity .18s ease;
    background: radial-gradient(85px circle at var(--px, 50%) var(--py, 50%), color-mix(in srgb, var(--heat) 17%, transparent), transparent 100%); }
  .entry:hover::after, .entry.hot::after { opacity: 1; }
  .entry.hot { box-shadow: var(--hot); }
  .entry svg { flex: none; overflow: visible; }
  .the { font-size: 12px; color: var(--muted); }
  .one { position: relative; display: inline-block; font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -1px; transform: rotate(-4deg); padding-right: 7px; margin-left: 1px; line-height: 1.15; }
  .one::after { content: ""; position: absolute; right: 0; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .lab { font-size: 12px; margin-left: 8px; }
  .sub { font-size: 12px; color: var(--muted); line-height: 18px; }
  .foam { position: relative; z-index: 3; height: 10px; margin: 0 2px; }
  .foam svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

  /* One cell per topic. Idle topics are quiet line drawings; the current, running and answered ones carry the brand tint. */
  .cell { cursor: grab; pointer-events: auto; }
  .cell.drag { cursor: grabbing; }
  .cell .b { stroke: none; fill: var(--sb); transition: fill .8s ease; }
  .cell .m { fill: none; stroke: var(--i-line); stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; transition: stroke .8s ease, stroke-width .4s ease; }
  .cell .n { fill: var(--i-dot); transition: fill .6s ease, stroke .6s ease; }
  .cell text { fill: var(--muted); text-anchor: middle; dominant-baseline: middle; pointer-events: none; user-select: none; transition: fill .6s ease; letter-spacing: .02em; }
  .cell.running .b, .cell.queued .b { fill: var(--tint); }
  .cell.running .m { stroke: var(--c-line); stroke-width: 1.3; }
  .cell.running .n, .cell.done .n { fill: var(--ac); }
  .cell.running text, .cell.done text { fill: var(--text); }
  .cell.done .b { fill: var(--d-fill); }
  .cell.done .m { stroke: var(--c-line); stroke-width: 1.3; }
  .cell.queued .m { stroke: var(--q-line); }
  .cell.queued .n { fill: transparent; stroke: var(--q-ink); stroke-width: 1; }
  .cell.queued text { fill: var(--q-ink); }
  .cell.cur .b { fill: var(--tint); }
  .cell.cur .m { stroke: var(--ac); stroke-width: 1.4; }
  .cell.cur .n { fill: var(--ac); }
  .cell.cur text { fill: var(--ac); }
  .cell.lit .m { stroke: var(--ac); stroke-width: 1.6; transition-duration: .15s; }
  .cell.ask .m { stroke: var(--ac); stroke-dasharray: 3 3; }
  .cell.fuse .m { stroke: var(--ac); stroke-width: 1.6; }
  .cell.more { cursor: pointer; }
  .cell.more .m { stroke-dasharray: 1.2 3; }
  .cell.more text { fill: var(--muted); }
  .neck .e { fill: none; stroke: var(--c-line); stroke-width: 1.3; stroke-linecap: round; }
  .ves .vm { fill: var(--tint); stroke: var(--ac); stroke-width: 1.1; }
  .ves .vn { fill: var(--ac); }

  .row { height: 36px; display: flex; align-items: center; gap: 8px; margin: 0 2px; padding: 0 9px; border-radius: 10px; overflow: hidden; }
  .row:hover, .sess:hover { background: var(--hover); }
  .row i, .sess i { flex: none; width: 14px; height: 14px; border: 1.3px solid var(--muted); border-radius: 4px; opacity: .6; }
  .sect { margin: 12px 8px 6px; font-size: 12px; color: var(--muted); white-space: nowrap; transition: opacity .2s; }
  .sess { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; opacity: .9; font-size: 13.5px; white-space: nowrap; overflow: hidden; transition: opacity .2s, background .15s, box-shadow .15s; }
  .sess.drop { background: color-mix(in srgb, var(--heat) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ac) 40%, transparent); }
  .took { animation: took 1s ease; }
  @keyframes took { 0% { background: color-mix(in srgb, var(--heat) 22%, transparent); } 100% { background: transparent; } }
  .chat { flex: 1; min-width: 0; padding: 22px; display: flex; flex-direction: column; gap: 14px; font-size: 13.5px; line-height: 1.75; color: var(--text); overflow: hidden; }
  .bubble { align-self: flex-end; max-width: 80%; padding: 7px 12px; border-radius: 12px; background: var(--hover); }
  .composer { margin-top: auto; height: 44px; border: .5px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 14px; color: var(--faint); font-size: 13px; }
  .tip { position: fixed; z-index: 50; padding: 4px 8px; border-radius: 7px; background: var(--tip); color: var(--tip-ink); font-size: 11.5px; line-height: 1.5; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%, 3px); transition: opacity .12s, transform .12s; }
  .tip.on { opacity: 1; transform: translate(-50%, 0); }
  .menu { position: fixed; z-index: 60; min-width: 150px; padding: 5px; border: 1px solid var(--border); border-radius: 12px; background: var(--menu); color: var(--text); box-shadow: 0 8px 30px #0000002a; font-size: 13px; }
  .menu div { padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  .menu div:hover { background: var(--hover); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
</style>
</head>
<body>
<div class="demo">
  <b>路由</b>
  <button id="old">落到旧话题</button>
  <button id="new">开新话题</button>
  <button id="aside">问个小问题</button>
  <button id="clarify">拿不准</button>
  <button id="correct">纠正上一句</button>
  <button id="burst">连发三句</button>
  <span class="sep"></span>
  <b>状态</b>
  <button id="finish">一个话题答完</button>
  <button id="more">多加 6 个话题</button>
  <button id="rail">收起侧栏</button>
  <button id="reset">重置</button>
  <div class="hint">话题之间按关联吸在一起 · 拖到别的话题上合并 · 拖到会话上关联 · 拖回主卡片接着聊 · 用力甩出侧栏 = 先放一边</div>
  <div id="meter"></div>
</div>
<div class="stage" id="stage"></div>
<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MAX_RUNNING = 3, VISIBLE = 14, N = 48, GAP = 2, SOFT = 2.2, MINI = .32, MARK_R = 7.4;
  // name, recency weight, topic workspace
  const TOPICS = [['显卡选购', .95, '装机'], ['旅游', .9, '出行'], ['周末书单', .8, '读书'], ['晚餐灵感', .7], ['周报整理', .62, '工作'], ['论文润色', .55, '工作'], ['搬家清单', .48, '家'],
    ['基金定投', .42, '理财'], ['健身计划', .36], ['换季衣物', .3, '家'], ['租房合同', .26, '家'], ['日语', .22, '出行'], ['生日礼物', .18], ['咖啡豆', .14], ['猫粮', .1, '家'], ['读书笔记', .07, '读书']];
  // relatedness TheOne learned from use (linkage.ts), on top of shared workspaces
  const LEARNED = [['显卡选购', '基金定投', .5], ['旅游', '换季衣物', .35], ['周末书单', '咖啡豆', .25]];
  const SPARE = ['周末露营', '面试准备', '牙医预约', '新年计划', '装修预算', '播客选题', '跑鞋', '学吉他', '报税', '相机镜头', '家庭聚餐', '滑雪', '盆栽', '车险', '桌游', '旧书转卖', '婚礼', '体检', '摄影', '宠物医院'];
  const ASIDES = ['汇率换算', '几点日落', '单位换算', '查个快递'];
  const fx = v => v.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (v, target, rate, dt) => v + (target - v) * Math.min(1, dt * rate);
  const now = () => performance.now();
  const apps = [];
  let uid = 0, spareAt = 0, asideAt = 0;

  function curve(p) { const n = p.length; let d = `M${fx(p[0][0])} ${fx(p[0][1])}`; p.forEach((p1, i) => { const p0 = p[(i + n - 1) % n], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n]; d += `C${fx(p1[0] + (p2[0] - p0[0]) / 6)} ${fx(p1[1] + (p2[1] - p0[1]) / 6)} ${fx(p2[0] - (p3[0] - p1[0]) / 6)} ${fx(p2[1] - (p3[1] - p1[1]) / 6)} ${fx(p2[0])} ${fx(p2[1])}`; }); return d + 'Z'; }
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k / 4; };
  function polygonArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length]; s += x1 * y2 - x2 * y1; } return Math.abs(s) / 2; }

  // A membrane neck between two round bodies: budding off the One mark, two topics fusing, or a pending merge.
  function bridge(c1, r1, c2, r2, reach = r2 * 2.5, v = .5, hs = 2.4) {
    const d = Math.hypot(c2.x - c1.x, c2.y - c1.y), maxD = r1 + reach;
    if (r1 <= 0 || r2 <= 0 || d > maxD || d <= Math.abs(r1 - r2)) return null;
    let u1 = 0, u2 = 0;
    if (d < r1 + r2) { u1 = Math.acos(clamp((r1 * r1 + d * d - r2 * r2) / (2 * r1 * d), -1, 1)); u2 = Math.acos(clamp((r2 * r2 + d * d - r1 * r1) / (2 * r2 * d), -1, 1)); }
    const ab = Math.atan2(c2.y - c1.y, c2.x - c1.x), spread = Math.acos(clamp((r1 - r2) / d, -1, 1));
    const a1 = ab + u1 + (spread - u1) * v, a2 = ab - u1 - (spread - u1) * v;
    const a3 = ab + Math.PI - u2 - (Math.PI - u2 - spread) * v, a4 = ab - Math.PI + u2 + (Math.PI - u2 - spread) * v;
    const P = (c, a, r) => [c.x + r * Math.cos(a), c.y + r * Math.sin(a)];
    const p1 = P(c1, a1, r1), p2 = P(c1, a2, r1), p3 = P(c2, a3, r2), p4 = P(c2, a4, r2);
    const tot = r1 + r2, k = Math.min(v * hs, Math.hypot(p1[0] - p3[0], p1[1] - p3[1]) / tot) * Math.min(1, d * 2 / tot);
    const H = (p, a, r) => [p[0] + r * Math.cos(a), p[1] + r * Math.sin(a)];
    const h1 = H(p1, a1 - Math.PI / 2, r1 * k), h2 = H(p2, a2 + Math.PI / 2, r1 * k), h3 = H(p3, a3 + Math.PI / 2, r2 * k), h4 = H(p4, a4 - Math.PI / 2, r2 * k);
    const s = p => fx(p[0]) + ' ' + fx(p[1]);
    return { edge: `M${s(p1)}C${s(h1)} ${s(h3)} ${s(p3)}M${s(p4)}C${s(h4)} ${s(h2)} ${s(p2)}`,
      fill: `M${s(p1)}C${s(h1)} ${s(h3)} ${s(p3)}L${s(p4)}C${s(h4)} ${s(h2)} ${s(p2)}Z` };
  }

  // How a name sits in a cell: one line if it fits, else two balanced lines, else no text at all (never a clipped name with an ellipsis).
  function layout(name, rr) {
    const big = rr >= 25 ? 10.5 : 9.5, small = rr >= 25 ? 9.5 : 8.8;
    const tries = [[1, big], [1, small], [2, big], [2, small]];
    for (const [lines, font] of tries) {
      if (lines === 1 && name.length > 3 && font === small && rr < 25) continue;
      const lh = font * 1.2, per = Math.ceil(name.length / lines);
      if (lines === 2 && (name.length < 4 || name.length > 8)) continue;
      const block = 5 + 4 + lines * lh; // nucleus, gap, text
      if (per * font > 2 * rr * (lines === 1 ? .8 : .74) - 4 || block > 2 * rr * .82) continue;
      return { lines: lines === 1 ? [name] : [name.slice(0, per), name.slice(per)], font, lh };
    }
    return { lines: [], font: big, lh: 0 };
  }

  function build(theme) {
    const app = document.createElement('div');
    app.className = 'app ' + theme;
    app.innerHTML = `
      <aside class="side">
        <div class="brand"><i></i><span class="tx">DSH</span></div>
        <div class="newsess">＋<span class="tx">新会话</span></div>
        <nav>
          <div class="entry"><svg class="mark" width="20" height="20" viewBox="0 0 20 20"><path class="bm" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle class="bn" fill="currentColor"/></svg>
            <div class="tx"><div><span class="the">The</span><span class="one">One</span><span class="lab">主聊天</span></div><div class="sub">从这里继续聊</div></div></div>
          <div class="foam"><svg><defs></defs><g class="cells"></g><g class="necks"></g><g class="vesicles"></g></svg></div>
          <div class="row"><i></i><span class="tx">持续任务</span></div>
        </nav>
        <div class="sect">今天</div><div class="sess" data-drop="session"><i></i>帮我看看配什么电脑</div><div class="sess" data-drop="session"><i></i>周报整理</div>
        <div class="sect">更早</div><div class="sess" data-drop="session"><i></i>一些零散的好点子</div>
      </aside>
      <section class="chat">
        <div class="bubble">5000 块配什么电脑比较好</div>
        <div>看你主要拿来做什么。偏游戏的话，显卡占预算的大头，处理器选中端就够了。</div>
        <div class="bubble">另外我想去哪旅游比较好</div>
        <div class="composer">继续聊…</div>
      </section>`;
    document.getElementById('stage').appendChild(app);
    const q = s => app.querySelector(s);
    const a = { app, theme, side: q('.side'), foam: q('.foam'), defs: q('defs'), layer: q('.cells'), necks: q('.necks'), vlayer: q('.vesicles'), entry: q('.entry'), mark: q('.mark'), bm: q('.bm'), bn: q('.bn'),
      cells: [], bonds: [], ves: [], links: new Map(), pulse: 0, drag: null, ptr: null, target: null, rail: false, sz: 1, h: 10, L: { x: 0, y: 0 }, look: { x: 0, y: 0 }, showUntil: 0, more: null, folded: 0, last: null };
    a.entry.addEventListener('pointermove', e => { if (a.drag) return; const r = a.entry.getBoundingClientRect(); a.entry.style.setProperty('--px', e.clientX - r.left + 'px'); a.entry.style.setProperty('--py', e.clientY - r.top + 'px'); });
    a.onMove = e => {
      const p = local(a, e), r = a.foam.getBoundingClientRect();
      a.ptr = e.clientX > r.left - 24 && e.clientX < r.right + 24 && e.clientY > r.top - 10 && e.clientY < r.bottom + 24 ? p : null;
      if (!a.drag) return;
      const c = a.drag.cell; c.tx = p.x - a.drag.dx; c.ty = p.y - a.drag.dy;
      a.drag.trail.push({ x: e.clientX, y: e.clientY, t: now() }); if (a.drag.trail.length > 8) a.drag.trail.shift();
      const hit = dropTarget(a, e, c);
      setTarget(a, hit);
      if (hit?.kind === 'main') { a.entry.style.setProperty('--px', a.L.x + 'px'); a.entry.style.setProperty('--py', '50%'); }
      const text = hit && dropText(c, hit);
      if (text) tip.at(e.clientX, e.clientY - 32, text, a); else tip.hide();
    };
    a.onUp = e => {
      if (!a.drag) return;
      const c = a.drag.cell, hit = a.target, trail = a.drag.trail; c.g.classList.remove('drag'); a.drag = null; tip.hide(); setTarget(a, null);
      if (hit?.kind === 'main') return mount(a, c);
      if (hit?.kind === 'cell') return busyState(c) || busyState(hit.cell) ? bond(a, c, hit.cell) : merge(a, c, hit.cell);
      if (hit?.kind === 'session') { hit.el.classList.remove('took'); void hit.el.offsetWidth; hit.el.classList.add('took'); vesicle(a, () => center(a, hit.el.querySelector('i')), () => cellPos(c), () => light(a, c, { run: false })); return; }
      // A throw: fast enough, or let go outside the sidebar.
      const first = trail.find(s => now() - s.t < 90) || trail[0], lastS = trail[trail.length - 1];
      if (!first || !lastS) return;
      const dt = Math.max(16, lastS.t - first.t) / 1000, vx = (lastS.x - first.x) / dt, vy = (lastS.y - first.y) / dt, sr = a.side.getBoundingClientRect();
      const out = e.clientX > sr.right + 6 || e.clientX < sr.left - 6;
      if (Math.hypot(vx, vy) > 1100 || out) fling(a, c, out && Math.hypot(vx, vy) < 400 ? { x: (e.clientX > sr.right ? 900 : -900), y: 0 } : { x: vx, y: vy }, e);
    };
    a.more = cell(a, '+0', 'idle', false, .2);
    a.more.kind = 'more'; a.more.g.classList.add('more');
    apps.push(a);
    return a;
  }
  const local = (a, e) => { const r = a.foam.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const center = (a, el) => { const r = el.getBoundingClientRect(), f = a.foam.getBoundingClientRect(); return { x: r.left + r.width / 2 - f.left, y: r.top + r.height / 2 - f.top }; };
  const cellPos = c => ({ x: c.cx, y: c.cy, r: c.R * c.scale });
  const busyState = c => c.state === 'running' || c.state === 'queued';
  const topics = a => a.cells.filter(c => c.kind !== 'more' && c.mode !== 'leave');

      else c.scale = ease(c.scale, c.hidden ? 0 : 1, c.hidden ? 5 : 2.5, dt);
      c.g.style.display = c.scale < .02 ? 'none' : '';
      if (c.scale < .02) { c.nf.setAttribute('d', ''); c.ne.setAttribute('d', ''); continue; }

      const r0 = sizeOf(c) * a.sz * (1 + (named(c) ? .04 : .2) * c.reveal);
      c.svx = ease(c.svx, c.vx, 8, dt); c.svy = ease(c.svy, c.vy, 8, dt);
      const speed = Math.hypot(c.svx, c.svy), st = Math.min(c.mode === 'fling' ? .2 : .12, speed / 1100), vx = c.svx / (speed || 1), vy = c.svy / (speed || 1);

      let gx = 0, gy = 0; for (const p of pts) { gx += p[0]; gy += p[1]; } gx /= N; gy /= N; c.cx = gx; c.cy = gy;
      const d = curve(pts);
      c.b.setAttribute('d', d); c.h.setAttribute('d', d); c.m.setAttribute('d', d);
      c.b.style.fillOpacity = fx(c.solid); c.h.style.opacity = fx(Math.min(1, c.heat + c.flash));
      c.stop.setAttribute('stop-opacity', fx((a.theme === 'dark' ? .22 : .15) * (1 + 1.4 * c.flash)));

})();
