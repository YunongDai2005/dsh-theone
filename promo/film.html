<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>TheOne Film</title>
<link rel="stylesheet" href="node_modules/@fontsource/inter/300.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/nunito/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/500.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:rgb(15,17,21)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07080b}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
svg{display:block}

/* ---------- desktop ---------- */
#desk{background:#06070a}
#deskWorld{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.wall{position:absolute;inset:-200px;background:
  radial-gradient(700px 600px at 25% 30%,rgba(70,90,190,.55),transparent 70%),
  radial-gradient(800px 700px at 80% 65%,rgba(120,60,150,.45),transparent 70%),
  radial-gradient(900px 500px at 50% 100%,rgba(30,120,170,.35),transparent 70%),
  linear-gradient(180deg,#0b0e1a,#120f1d)}
.dock{position:absolute;left:250px;top:1640px;width:580px;height:140px;border-radius:40px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.dicon{position:absolute;top:1660px;width:100px;height:100px;border-radius:24px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#dsh{background:linear-gradient(180deg,#ffffff,#eef1f7);display:flex;align-items:center;justify-content:center;color:#4d6bfe}
#dsh svg{width:64px;height:47px}
.ddot{position:absolute;top:1768px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.75)}

/* ---------- app (window replica) ---------- */
#appwrap{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2200px;perspective-origin:540px 960px;
  background:radial-gradient(1200px 1400px at 50% 45%,#16181d 0%,#0a0b0e 60%,#050507 100%)}
#w3{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.win{position:absolute;left:0;top:0;width:2000px;height:1100px;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 80px 200px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.side{position:absolute;left:0;top:0;width:372px;height:1100px;background:rgb(249,250,251);border-right:1px solid #eceef1}
.logo{position:absolute;left:20px;top:29px;color:rgb(15,17,21)}
.logo svg{width:250px;height:33px}
.pbtn{position:absolute;left:326px;top:33px;color:rgb(97,102,107)}
.pbtn svg,.ico svg{width:100%;height:100%}
.newbtn{position:absolute;left:18px;top:90px;width:336px;height:50px;border-radius:14px;border:1.5px solid #e3e6eb;background:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:500}
.ico{display:inline-block;flex:none}
.one{position:absolute;left:18px;top:163px;width:336px;height:91px;border-radius:14px;border:2px solid #eed3bb;background:#fff5ec;
  color:#a75b1e;display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 0 22px 4px rgba(255,107,0,.14),0 4px 32px 6px rgba(255,118,0,.05);z-index:5}
.osym{width:28px;height:28px;border:1.8px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;margin:0 3px}
.osym:after{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.ocopy{display:flex;flex-direction:column;gap:3px}
.otitle{display:flex;align-items:center;gap:12px;line-height:28px}
.owm{display:inline-flex;align-items:baseline;gap:1px;white-space:nowrap}
.othe{font-size:16px;color:rgb(97,102,107);letter-spacing:-.3px}
.oone{position:relative;font-family:'Nunito',sans-serif;font-size:26px;font-weight:700;letter-spacing:-1.2px;display:inline-block;transform:rotate(-4deg);padding-right:9px;line-height:1.15}
.odot{position:absolute;right:0;top:2px;width:5px;height:5px;border-radius:50%;background:currentColor}
.olab{font-size:16px}
.osub{font-size:16px;color:rgb(97,102,107)}
.nav{position:absolute;left:22px;height:44px;display:flex;align-items:center;gap:14px;font-size:19.5px}
.nav .ico{width:20px;height:20px;color:rgb(50,54,60)}
.wsh{position:absolute;left:22px;top:404px;width:330px;display:flex;align-items:center;justify-content:space-between;font-size:18.5px;color:rgb(129,133,140)}
.wsh .ics{display:flex;gap:22px;color:rgb(97,102,107)}.wsh .ico{width:21px;height:21px}
.list{position:absolute;left:0;top:452px;width:372px;height:535px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 86%,transparent 100%)}
.lin{position:absolute;left:0;top:0;width:372px}
.frow{height:47px;display:flex;align-items:center;gap:10px;padding-left:26px;font-size:19.5px;color:rgb(15,17,21)}
.frow .ico{width:21px;height:21px;color:rgb(97,102,107)}
.frow.cl .ico{color:rgb(97,102,107)}
.kids{}
.srow{position:relative;height:45px;margin:0 10px;border-radius:12px;display:flex;align-items:center;padding:0 12px 0 44px;font-size:19px;color:rgb(15,17,21)}
.srow .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .mt{font-size:14px;color:rgb(129,133,140);margin-left:10px}
.srow .gd{position:absolute;left:24px;top:19px;width:8px;height:8px;border-radius:50%;background:#2fb36b}
.srow.sel{background:rgba(38,49,72,.075)}
.srow.more{color:rgb(129,133,140);font-size:17px}
.bot{position:absolute;left:22px;height:44px;display:flex;align-items:center;gap:14px;font-size:19.5px}
.bot .ico{width:21px;height:21px;color:rgb(50,54,60)}
.main{position:absolute;left:372px;top:0;width:1628px;height:1100px;background:#fff}
.mtop{position:absolute;left:38px;top:16px;display:flex;align-items:center;gap:30px;font-size:19.5px;font-weight:600;white-space:nowrap}
.mtop .tag{font-weight:400;color:rgb(129,133,140);font-size:17px;display:flex;gap:8px;align-items:center}
.mtabs{position:absolute;left:38px;top:62px;display:flex;gap:46px;font-size:19px;color:rgb(97,102,107)}
.mtabs .on{color:#3b6cf6;position:relative}.mtabs .on:after{content:'';position:absolute;left:0;right:0;bottom:-12px;height:3px;border-radius:2px;background:#3b6cf6}
.mline{position:absolute;left:0;right:0;top:98px;height:1px;background:#eef0f3}
.chat{position:absolute;left:291px;top:120px;width:1047px}
.ub{margin-left:auto;width:fit-content;max-width:735px;background:rgb(237,242,252);border-radius:24px;padding:18px 22px;font-size:19.5px;line-height:1.55;margin-top:22px}
.at{font-size:19.5px;line-height:1.7;margin-top:28px;color:rgb(15,17,21)}
.st{font-size:18px;color:rgb(129,133,140);margin-top:34px;padding-bottom:14px;border-bottom:1px solid #eef0f3}
.inp{position:absolute;left:270px;top:935px;width:1090px;height:130px;border-radius:26px;border:1px solid #e3e6eb;background:#fff;box-shadow:0 8px 30px rgba(20,30,60,.06)}
.inp .ph{position:absolute;left:20px;top:20px;font-size:19px;color:rgb(173,178,184)}
.inp .pl{position:absolute;left:14px;top:80px;width:34px;height:34px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#333}
.inp .pl .ico{width:18px;height:18px}
.inp .sd{position:absolute;right:12px;top:76px;width:44px;height:44px;border-radius:50%;background:rgb(160,186,250);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
#dimW{position:absolute;left:0;top:0;width:2000px;height:1100px;background:#050608;opacity:0;z-index:4;pointer-events:none}
#rays{position:absolute;left:-1114px;top:-1092px;width:2600px;height:2600px;z-index:4;opacity:0;border-radius:50%;filter:blur(6px);
  background:repeating-conic-gradient(from 0deg,rgba(255,190,120,0) 0deg 9deg,rgba(255,206,150,.42) 11deg 12.5deg,rgba(255,190,120,0) 14.5deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 18%,transparent 50%)}
#halo{position:absolute;left:-414px;top:-192px;width:1200px;height:800px;z-index:4;opacity:0;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,166,90,.55) 0%,rgba(255,130,50,.18) 38%,transparent 68%)}
.cur{position:absolute;left:0;top:0;width:28px;height:42px;z-index:20;transform-origin:3px 3px;pointer-events:none}
.cur svg{position:absolute;left:0;top:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}

/* ---------- 3D layers ---------- */
.lay{position:absolute;left:0;top:0;transform-style:preserve-3d;border-radius:22px}
.glass{background:linear-gradient(160deg,rgba(40,48,66,.82),rgba(18,22,32,.88));border:1.5px solid rgba(190,205,235,.28);
  box-shadow:0 0 60px rgba(120,150,220,.16),inset 0 1px 0 rgba(255,255,255,.12)}
.lift{background:#fff5ec;border:2px solid #f0c9a4;color:#a75b1e;display:flex;align-items:center;gap:14px;padding:0 16px}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.rlab{position:absolute;left:26px;top:20px;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:3px;color:rgba(200,212,240,.6)}
.rtag{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:34px;letter-spacing:6px;color:#ffc58a;opacity:0}
.card{position:absolute;padding:18px 20px;border-radius:16px}
.card .ct{font-size:22px;font-weight:600;color:#eef2fa;white-space:nowrap}
.card .cl{height:8px;border-radius:4px;background:rgba(200,212,240,.16);margin-top:13px}
.card .cm{font-size:13px;color:rgba(200,212,240,.55);margin-top:6px;font-family:'JetBrains Mono',monospace}
.hist .hl{position:absolute;height:7px;border-radius:4px;background:rgba(200,212,240,.13)}

/* ---------- overlays ---------- */
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.orb{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;
  box-shadow:0 0 18px 6px rgba(255,190,120,.95),0 0 60px 20px rgba(255,140,40,.55)}
.bub{position:absolute;left:0;top:0;white-space:nowrap;font-size:30px;font-weight:500;padding:14px 24px;border-radius:24px;
  background:rgba(255,255,255,.96);color:#111;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.bub.r{background:rgb(237,242,252)}
.chip{position:absolute;left:0;top:0;white-space:nowrap;font-size:31px;padding:9px 16px;border-radius:12px;background:rgba(30,36,50,.9);
  border:1px solid rgba(190,205,235,.25);color:#dfe6f5}
.clab{position:absolute;left:0;top:0;font-family:'JetBrains Mono',monospace;font-size:40px;letter-spacing:4px;color:#ffc58a;white-space:nowrap}
#beams{position:absolute;left:0;top:0}

/* ---------- end ---------- */
#end{background:radial-gradient(1000px 1000px at 50% 46%,#1a1410 0%,#08080a 60%,#040405 100%)}
.ewm{position:absolute;left:0;right:0;top:760px;display:flex;justify-content:center;align-items:baseline;gap:6px;color:#ff9a4a}
.ewm .t{font-size:64px;color:rgba(255,255,255,.72);font-weight:300;letter-spacing:-1px}
.ewm .o{position:relative;font-family:'Nunito';font-size:170px;font-weight:700;letter-spacing:-8px;transform:rotate(-4deg);padding-right:34px;line-height:1;
  text-shadow:0 0 40px rgba(255,140,50,.55),0 0 120px rgba(255,110,20,.35)}
.ewm .d{position:absolute;right:4px;top:18px;width:22px;height:22px;border-radius:50%;background:#ff9a4a;box-shadow:0 0 30px rgba(255,140,50,.9)}
.etag{position:absolute;left:0;right:0;top:1010px;text-align:center;font-size:52px;font-weight:300;color:#f2f2f2;letter-spacing:-.5px}
.eurl{position:absolute;left:0;right:0;top:1110px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:31px;color:rgba(255,255,255,.62)}
.edisc{position:absolute;left:0;right:0;top:1500px;text-align:center;font-size:25px;color:rgba(255,255,255,.4);letter-spacing:.5px}

#flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(900px 900px at 50% 50%,#fff8ee 0%,rgba(255,236,210,.9) 35%,rgba(255,220,180,0) 75%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1100px 1500px at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;left:-256px;top:-256px;width:1592px;height:2432px;pointer-events:none;opacity:.045;mix-blend-mode:overlay}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="vb" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter></svg>
<div id="stage">
  <div id="desk" class="layer"><div id="deskWorld"></div></div>
  <div id="appwrap"><div id="cam"><div id="w3"></div><div id="ov"></div></div></div>
  <div id="end" class="layer"></div>
  <div id="flash"></div>
  <div id="vig"></div>
  <canvas id="grain" width="398" height="608"></canvas>
  <div id="fade"></div>
</div>
<script src="dsh-icons.js"></script>
<script src="film.js"></script>
</body></html>
