<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>TheOne Promo</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/nunito/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/nunito/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/500.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'Inter','Noto Sans SC','Noto Color Emoji',sans-serif;-webkit-font-smoothing:antialiased;color:#1f2328}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0f1a}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
.ico{width:1em;height:1em;flex:none}

/* ---------- desktop ---------- */
#desk{background:#e9e4f2}
#deskWorld{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;
  background:radial-gradient(900px 800px at 15% 18%,#ffd7b5 0%,rgba(255,215,181,0) 70%),
             radial-gradient(900px 900px at 92% 78%,#b8c6ff 0%,rgba(184,198,255,0) 70%),
             linear-gradient(165deg,#fde6d3,#e0e6fb)}
.sticky{position:absolute;left:120px;top:560px;width:400px;height:400px;background:#ffe680;border-radius:10px;
  transform:rotate(-5deg);box-shadow:0 18px 40px rgba(90,70,0,.22);padding:44px 40px;font-size:36px;font-weight:700;line-height:1.6;color:#4a3b00}
.sticky .t{font-size:44px;font-weight:900;margin-bottom:10px}
.sticky s{opacity:.55}
.widget{position:absolute;left:580px;top:600px;width:390px;height:250px;border-radius:44px;background:rgba(255,255,255,.72);
  box-shadow:0 18px 40px rgba(60,40,90,.15);padding:38px 42px}
.widget .d{font-size:30px;color:#e5484d;font-weight:700;letter-spacing:1px}
.widget .e{font-size:42px;font-weight:700;margin-top:16px}
.widget .f{font-size:30px;color:#6b6f76;margin-top:8px}
.dock{position:absolute;left:90px;width:900px;top:1468px;height:194px;border-radius:58px;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);box-shadow:0 20px 60px rgba(60,40,90,.18)}
.appicon{position:absolute;top:1495px;width:140px;height:140px;border-radius:34px;display:flex;align-items:center;justify-content:center;font-size:74px;box-shadow:0 8px 22px rgba(0,0,0,.16);transform-origin:50% 100%}
#dshIcon{background:linear-gradient(160deg,#6b84ff,#3c5bf0);color:#fff}
#dshIcon svg{width:96px;height:66px}
.tooltip{position:absolute;left:705px;top:1395px;transform:translateX(-50%);background:rgba(40,40,48,.86);color:#fff;font-size:30px;padding:10px 22px;border-radius:14px;white-space:nowrap}

/* ---------- sidebar app ---------- */
#app{background:#f7f8fa;transform-origin:0 0}
#sb{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#sbInner{position:absolute;left:0;top:0;width:1080px;padding:200px 56px 120px}
.hdr{height:130px;display:flex;align-items:center;gap:18px;padding:0 10px}
.hdr .wh{color:#4d6bfe}.hdr .wh svg{width:74px;height:52px}
.hdr .ds{font-size:54px;font-weight:600;letter-spacing:-1.5px;color:#222}
.hdr .hb{font-size:20px;font-weight:800;letter-spacing:2px;background:#16181c;color:#fff;padding:5px 12px;border-radius:7px}
.hdr .sp{flex:1}.hdr .pi{color:#666;font-size:46px}
.newbtn{height:116px;border:2px solid #e3e5e8;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;gap:16px;margin:12px 0 30px;color:#222}
.newbtn .ico{font-size:44px}
.one{position:relative;z-index:5;display:flex;align-items:center;gap:26px;height:190px;padding:0 32px;margin:0 0 40px;border-radius:34px;
  border:3px solid #eed3bb;background:#fff5ec;color:#a75b1e;transform-origin:50% 50%}
.osym{width:54px;height:54px;border:3.5px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;margin:0 6px}
.osym:after{content:'';width:13px;height:13px;border-radius:50%;background:currentColor}
.ocopy{display:flex;flex-direction:column;gap:4px}
.otitle{display:flex;align-items:center;gap:24px}
.owm{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.othe{font-size:34px;color:#6b6f76;letter-spacing:-.5px}
.oone{position:relative;font-family:'Nunito',sans-serif;font-size:58px;font-weight:800;letter-spacing:-2px;display:inline-block;transform:rotate(-4deg);padding-right:17px;line-height:1.1}
.odot{position:absolute;right:0;top:4px;width:11px;height:11px;border-radius:50%;background:currentColor}
.olab{font-size:34px}
.osub{font-size:34px;color:#6b6f76}
.row{height:104px;display:flex;align-items:center;gap:22px;font-size:38px;color:#1f2328;border-radius:22px;padding:0 24px;position:relative;white-space:nowrap;overflow:hidden}
.row .ico{font-size:40px;color:#555}
.row.sess{padding-left:100px;color:#30353b}
.row.sec{color:#8a8f98;font-size:34px;justify-content:space-between}
.row.sec .ics{display:flex;gap:30px;color:#8a8f98}
.row.folder .ico{color:#4d6bfe}
.row.hover{background:#eceef2}
.row.sel{background:#e6e9ef}
.kids{overflow:hidden}
#dimIn{position:absolute;left:-100px;top:-400px;width:1280px;height:12000px;background:#1a1009;z-index:3;opacity:0;pointer-events:none}
#rays{position:absolute;width:2600px;height:2600px;z-index:4;opacity:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,196,120,0) 0deg 7deg,rgba(255,200,130,.55) 9deg 11deg,rgba(255,196,120,0) 13deg 20deg);
  -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,1) 0%,rgba(0,0,0,.6) 25%,rgba(0,0,0,0) 62%)}
#halo{position:absolute;width:1500px;height:900px;z-index:4;opacity:0;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,170,90,.75) 0%,rgba(255,140,60,.25) 40%,rgba(255,140,60,0) 70%)}
#motes{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:6;pointer-events:none}
.mote{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff3d6;box-shadow:0 0 16px 4px rgba(255,200,120,.8)}
#speed{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.sl{position:absolute;width:4px;border-radius:4px;background:linear-gradient(rgba(120,130,150,0),rgba(120,130,150,.55),rgba(120,130,150,0))}

/* ---------- split-flap board ---------- */
#board{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(1200px 900px at 50% 40%,#22262d,#0d0f12);opacity:0}
.bhead{position:absolute;left:101px;top:330px;width:878px;display:flex;justify-content:space-between;align-items:flex-end;color:#f2c14e;font-weight:900}
.bhead .a{font-size:46px;letter-spacing:2px}.bhead .a small{font-family:'Inter';font-size:30px;letter-spacing:6px;margin-left:16px;color:#c9a23f}
.bhead .b{font-size:30px;color:#9aa0a8;letter-spacing:2px}
.tile{position:absolute;width:66px;height:86px}
.tile .h{position:absolute;left:0;width:66px;height:43px;overflow:hidden;background:#2b3038}
.tile .top{top:0;border-radius:7px 7px 0 0;background:linear-gradient(#323843,#2a2f37)}
.tile .bot{top:43px;border-radius:0 0 7px 7px;background:linear-gradient(#262a31,#1f2329)}
.tile span{position:absolute;left:0;width:66px;height:86px;line-height:86px;text-align:center;font-size:50px;font-weight:700;color:#f1ede2}
.tile .bot span{top:-43px}.tile .top span{top:0}
.tile .leaf{position:absolute;left:0;width:66px;height:43px;overflow:hidden;backface-visibility:hidden}
.tile:after{content:'';position:absolute;left:0;right:0;top:42px;height:2px;background:#0b0c0e}
.tile.amber span{color:#f2c14e}.tile.red span{color:#ff6b5e}.tile.dim span{color:#9fd8a0}

/* ---------- chat ---------- */
#chat{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff}
.chatTop{position:absolute;left:0;right:0;top:170px;height:140px;border-bottom:2px solid #eef0f2;display:flex;align-items:center;padding:0 40px;gap:24px}
.chatTop .back{font-size:44px;color:#555}
.chatTop .ct{font-size:44px;font-weight:700;white-space:nowrap}
.chatTop .cs{font-size:28px;color:#8a8f98;margin-top:4px}
.msgs{position:absolute;left:0;right:0;top:370px;padding:0 50px;display:flex;flex-direction:column;gap:50px}
.ub{align-self:flex-end;background:#eef1f6;border-radius:40px;padding:26px 38px;font-size:44px;max-width:820px;line-height:1.45}
.aiw{display:flex;gap:24px;align-items:flex-start}
.av{width:78px;height:78px;border-radius:50%;background:#4d6bfe;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.av svg{width:52px;height:36px}
.at{font-size:44px;line-height:1.62;color:#1f2328;max-width:860px;white-space:pre-wrap}
.at .tip{font-weight:900;padding:0 4px;border-radius:8px}
.dots{font-size:60px;color:#b3b8c0;letter-spacing:6px;line-height:1}
.cinput{position:absolute;left:50px;right:50px;top:1600px;height:130px;border-radius:44px;border:2px solid #e3e5e8;background:#fafbfc;font-size:38px;color:#9aa0a6;display:flex;align-items:center;padding:0 40px}
.stamp{position:absolute;left:540px;top:1170px;font-size:104px;font-weight:900;color:#e5484d;border:10px solid #e5484d;border-radius:30px;padding:6px 44px;background:rgba(255,255,255,.9);white-space:nowrap}
.counter{position:absolute;left:540px;top:1470px;transform:translateX(-50%);font-size:36px;font-weight:700;color:#b42318;background:#fff1f0;border:2px solid #ffd2cf;padding:12px 30px;border-radius:40px;white-space:nowrap}

/* ---------- 3D ---------- */
#cam3d{perspective:3200px;perspective-origin:540px 960px;
  background:radial-gradient(1000px 1100px at 50% 52%,#1d2747 0%,#0b1022 55%,#05070e 100%)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.p3{position:absolute;left:0;top:0;transform-style:preserve-3d}
.plane{border-radius:30px;border:2px solid rgba(160,190,255,.45);background:rgba(28,38,72,.86);color:#fff;
  box-shadow:0 0 60px rgba(110,150,255,.28),inset 0 0 40px rgba(120,160,255,.12);padding:30px 36px}
.plane.mainp{background:rgba(255,245,236,.96);border:3px solid #eed3bb;color:#3a2a1c;box-shadow:0 0 90px 10px rgba(255,120,20,.45)}
.mh{display:flex;align-items:center;gap:18px;font-size:40px;color:#a75b1e}
.mh .osym{width:46px;height:46px;margin:0}
.mh b{font-family:'Nunito';font-weight:800;font-size:46px}
.ml{margin-top:22px;font-size:32px;line-height:1.45;padding:14px 22px;border-radius:22px;background:#f1e3d4;color:#3a2a1c;min-height:66px}
.ml.ai{background:#fff;border:2px solid #f0dcc8}
.rt{font-size:42px;font-weight:900}
.rs{font-size:27px;color:#b9c6ea;margin-top:6px}
.code{font-family:'JetBrains Mono',monospace;font-size:24px;color:#9ef0c0;margin-top:22px;height:36px;white-space:nowrap;overflow:hidden}
.rres{font-size:32px;font-weight:700;color:#ffd08a;margin-top:10px;height:46px}
.chips{display:flex;gap:12px;margin-top:18px}
.chips span{font-family:'Inter';font-weight:800;font-size:23px;letter-spacing:1px;padding:10px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.25);color:#c7d2f0}
.chips span.on{background:#ffb35c;border-color:#ffb35c;color:#1b1206;box-shadow:0 0 30px rgba(255,170,80,.8)}
.wk{display:flex;flex-direction:column;justify-content:center;height:100%}
.wt{font-size:40px;font-weight:900}
.ws{font-size:26px;color:#b9c6ea;margin-top:8px}
.badge{margin-top:12px;font-size:24px;font-weight:700;color:#1b1206;background:#ffd08a;border-radius:12px;padding:6px 12px;align-self:flex-start;opacity:0}
.dbw{display:flex;gap:26px;height:100%}
.db{flex:1;border-radius:22px;background:rgba(255,255,255,.06);border:2px dashed rgba(160,190,255,.35);padding:26px}
.dbt{font-size:34px;font-weight:900}.dbs{font-size:25px;color:#b9c6ea;margin-top:12px;line-height:1.5}
.beam{position:absolute;left:0;top:0;width:6px;transform-origin:50% 0;background:linear-gradient(rgba(140,190,255,.9),rgba(140,190,255,.15));box-shadow:0 0 14px rgba(140,190,255,.7);border-radius:3px}
.cap3{position:absolute;left:0;top:0;white-space:nowrap;font-size:34px;font-weight:700;padding:16px 26px;border-radius:30px;color:#fff;background:#ff8a2a;box-shadow:0 0 40px rgba(255,140,40,.9)}
.cap3.a{background:#4d6bfe;box-shadow:0 0 40px rgba(90,120,255,.9)}

/* ---------- catalog ---------- */
#cat{background:#0b1022}
.chip{position:absolute;left:0;top:0;white-space:nowrap;font-size:34px;font-weight:500;padding:12px 24px;border-radius:18px;background:#262b33;color:#eee;border:2px solid #3a404a}
.gcard{position:absolute;left:90px;width:900px;height:370px;border-radius:36px;border:2px solid rgba(160,190,255,.35);background:rgba(28,38,72,.6)}
.gcard .gt{position:absolute;left:40px;top:26px;font-size:42px;font-weight:900;color:#fff}
.gcard .gt small{font-size:30px;color:#8a93a8;margin-left:12px;font-weight:700}
.cont{position:absolute;right:30px;font-size:30px;padding:10px 24px;border-radius:16px;border:2px solid #d9dce1;background:#fff;color:#222;font-weight:500}
.cathead{position:absolute;left:90px;top:345px;font-size:30px;color:#8a8f98}
.sheet{position:absolute;left:50px;right:50px;top:1180px;border-radius:40px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.25);padding:40px;display:flex;gap:24px;border:2px solid #eee}
.sheet .at{font-size:40px}

/* ---------- features ---------- */
#feat{background:radial-gradient(1100px 1200px at 50% 40%,#1d2747,#070a14)}
.fcard{position:absolute;left:70px;width:940px;height:200px;border-radius:40px;background:rgba(255,255,255,.96);display:flex;align-items:center;gap:34px;padding:0 44px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.fcard .fe{font-size:86px;width:110px;text-align:center}
.fcard .ft{font-size:46px;font-weight:900;color:#16181c}
.fcard .fs{font-size:30px;color:#6b6f76;margin-top:8px}

/* ---------- end ---------- */
#end{background:#fffaf4}
.tag{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:76px;font-weight:900;letter-spacing:2px}
.tag2{position:absolute;left:0;right:0;top:590px;text-align:center;font-size:38px;color:#6b6f76}
.bigone{position:absolute;left:90px;width:900px;top:740px;margin:0}
.install{position:absolute;left:90px;width:900px;top:1030px;border-radius:36px;padding:36px 40px;background:#fff;border:2px solid #eee;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.install .s{font-size:34px;color:#555}
.install .u{font-family:'JetBrains Mono',monospace;font-size:33px;margin-top:16px;color:#16181c;background:#f4f5f7;border-radius:16px;padding:18px 20px}
.perks{position:absolute;left:0;right:0;top:1340px;text-align:center;font-size:34px;color:#6b6f76}
.plan{position:absolute;left:0;right:0;top:1450px;text-align:center;font-size:40px;font-style:italic;font-family:'Inter';font-weight:600}
.disc{position:absolute;left:0;right:0;top:1530px;text-align:center;font-size:26px;color:#9aa0a6}

/* ---------- overlays ---------- */
#cursor{position:absolute;left:0;top:0;width:60px;height:80px;transform-origin:0 0;pointer-events:none;z-index:50}
#cursor svg{position:absolute;left:0;top:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#ripple{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;border:6px solid rgba(255,140,40,.9);z-index:49;opacity:0}
#sweat{position:absolute;left:0;top:0;width:34px;height:46px;z-index:51;opacity:0}
#caps{position:absolute;left:0;top:190px;width:1080px;display:flex;justify-content:center;z-index:60;pointer-events:none}
#cap{max-width:980px;font-size:54px;font-weight:900;color:#fff;background:rgba(17,17,20,.9);padding:20px 40px;border-radius:30px;text-align:center;line-height:1.35;
  box-shadow:0 12px 40px rgba(0,0,0,.25);white-space:nowrap}
#cap .hl{color:#ffb35c}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:70;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:80;pointer-events:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="vb" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter></svg>
<div id="stage">
  <div id="desk" class="layer"><div id="deskWorld"></div></div>
  <div id="app" class="layer">
    <div id="sb"><div id="sbInner"></div></div>
    <div id="speed"></div>
    <div id="motes"></div>
    <div id="board"></div>
    <div id="chat"></div>
  </div>
  <div id="cam3d" class="layer"><div id="world"></div></div>
  <div id="cat" class="layer"></div>
  <div id="feat" class="layer"></div>
  <div id="end" class="layer"></div>
  <div id="ripple"></div>
  <div id="cursor"></div>
  <svg id="sweat" viewBox="0 0 34 46"><path d="M17 2C17 2 3 20 3 30a14 14 0 0 0 28 0C31 20 17 2 17 2z" fill="#7cc4ff" stroke="#2b7fd0" stroke-width="2.5"/><ellipse cx="11" cy="30" rx="3" ry="6" fill="#fff" opacity=".8"/></svg>
  <div id="caps"><div id="cap"></div></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="promo.js"></script>
</body></html>
