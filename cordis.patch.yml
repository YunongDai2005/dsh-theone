# Uses DSH configured models and credentials; no extra API key.
- insert:
    - id: theone
      name: dsh-theone
      config:
        historyCatalog: !!js process.env.THEONE_HISTORY_CATALOG !== 'false'
        databasePath: !!js process.env.THEONE_DATABASE_PATH
        contextsPath: !!js process.env.THEONE_CONTEXTS_PATH
        gatewayKey: !!js process.env.THEONE_GATEWAY_KEY || 'default'
        workerProvider: !!js process.env.THEONE_WORKER_PROVIDER
        workerModel: !!js process.env.THEONE_WORKER_MODEL
        routerMode: !!js process.env.THEONE_ROUTER_MODE || 'llm'
